<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>حذف ملک</title>
</head>
<body>

    <h1>حذف ملک</h1>

    <p>
        آیا مطمئن هستید که می‌خواهید ملک
        «{{ property.title }}»
        را حذف کنید؟
    </p>

    <form method="POST">
        {% csrf_token %}
        <button type="submit">بله، حذف شود</button>
    </form>

    <a href="{% url 'property_detail' property.pk %}">
        انصراف
    </a>

</body>
</html>
